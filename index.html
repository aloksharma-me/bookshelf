<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookshelf</title>
<meta name="description" content="Every book I've finished, and every line I underlined.">
<!-- Set the theme before the page draws, so dark mode doesn't flash light first -->
<script>try{const t=localStorage.getItem('theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.svg">
</head>
<body class="page-home">
<header class="site-head wrap">
  <a class="brand" href="index.html">Bookshelf</a>
  <nav>
    <a href="index.html" aria-current="page">Shelf</a>
    <a href="books.html">Index</a>
    <button type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </nav>
</header>

<main id="top" class="home">
  <section class="intro wrap">
    <p class="eyebrow" id="shelf-stats">Opening the books…</p>
    <h1>Every book I’ve finished, and every line I couldn’t leave unmarked.</h1>
  </section>

  <section class="shelf-wrap wrap" aria-label="Bookshelf">
    <div class="shelf-bar">
      <p class="shelf-caption" aria-live="polite">Spine thickness is how much I underlined. Pick one.</p>
      <div class="arrange" role="group" aria-label="Arrange shelf">
        <span>Arrange</span>
        <button type="button" data-sort="cat" aria-pressed="true">Colour</button>
        <button type="button" data-sort="title" aria-pressed="false">A–Z</button>
        <button type="button" data-sort="count" aria-pressed="false" disabled>Most marked</button>
      </div>
    </div>
    <div class="shelf" id="shelf"></div>
    <ul class="legend" id="legend" aria-label="Filter by category"></ul>
  </section>

  <section class="margin wrap" aria-label="A random highlight">
    <p class="eyebrow">From the margins</p>
    <figure class="margin-quote">
      <blockquote id="mq-text" class="is-loading">Finding a good line…</blockquote>
      <figcaption><a id="mq-link" href="books.html"><span class="mq-dot"></span><span id="mq-book"></span></a> <span id="mq-author"></span></figcaption>
    </figure>
    <button type="button" class="btn-ghost" id="mq-next" disabled>Another one →</button>
  </section>
</main>
<footer class="site-foot wrap">
  <span>Highlights &amp; notes, kept since 2021.</span>
  <a href="#top">Back to top ↑</a>
</footer>
<script>
  // Browsers won't run these scripts from a double-clicked file, so explain instead of hanging.
  if (location.protocol === 'file:') document.querySelector('main').innerHTML =
    '<div class="notice wrap"><h1>Open this through a local server</h1><p>Browsers block pages opened as files from reading the notes in Books/. In a terminal, from this folder, run <code>python3 -m http.server</code> and visit <a href="http://localhost:8000">localhost:8000</a>. See README.md for more.</p></div>';
</script>
<script type="module" src="js/home.js"></script>
</body>
</html>
